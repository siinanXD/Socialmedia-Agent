[project]
name = "socialmedia-worker"
version = "0.1.0"
description = "FFmpeg/ffprobe media worker for the Socialmedia-Agent"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["socialmedia_worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
