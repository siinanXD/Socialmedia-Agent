name: GitHub review credentials
description: Load one GitHub PAT from Infisical OIDC or an existing repository secret.
inputs:
  domain:
    description: Infisical instance URL.
    default: https://eu.infisical.com
  audience:
    description: GitHub OIDC audience configured on the shared machine identity.
    default: https://github.com/siinanXD
  identity-id:
    description: Infisical OIDC machine identity ID; empty uses the fallback token.
    default: ''
  project-id:
    description: Infisical project ID.
    default: ''
  environment:
    description: Infisical environment slug.
    default: dev
  secret-path:
    description: Infisical path containing the shared GitHub PAT.
    default: /leitstand
  secret-name:
    description: Existing GitHub PAT secret name in Infisical.
    default: GITHUB_AUTOMATION_TOKEN
  fallback-token:
    description: Existing GitHub PAT used only when OIDC is not configured.
    default: ''
runs:
  using: composite
  steps:
    - name: Validate Infisical configuration
      if: inputs.identity-id != ''
      shell: bash
      env:
        PROJECT_ID: ${{ inputs.project-id }}
        SECRET_NAME: ${{ inputs.secret-name }}
        SECRET_PATH: ${{ inputs.secret-path }}
      run: |
        set -euo pipefail
        if [[ -z "$PROJECT_ID" || ! "$SECRET_NAME" =~ ^[A-Za-z_][A-Za-z0-9_]*$ || "$SECRET_PATH" != /* ]]; then
          echo '::error::Infisical requires a project ID, a valid secret name and an absolute secret path.'
          exit 1
        fi
    - name: Load only the GitHub token
      if: inputs.identity-id != ''
      uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
      with:
        method: oidc
        domain: ${{ inputs.domain }}
        oidc-audience: ${{ inputs.audience }}
        identity-id: ${{ inputs.identity-id }}
        project-id: ${{ inputs.project-id }}
        env-slug: ${{ inputs.environment }}
        secret-path: ${{ inputs.secret-path }}
        secret-name: ${{ inputs.secret-name }}
        include-imports: false
        recursive: false
    - name: Make credentials available to the gate
      shell: bash
      env:
        IDENTITY_ID: ${{ inputs.identity-id }}
        SECRET_NAME: ${{ inputs.secret-name }}
        FALLBACK_TOKEN: ${{ inputs.fallback-token }}
      run: |
        set -euo pipefail
        if [[ -n "$IDENTITY_ID" ]]; then
          token="${!SECRET_NAME:-}"
        else
          token="$FALLBACK_TOKEN"
        fi
        if [[ -z "$token" ]]; then
          echo '::error::GitHub review token missing. Configure Infisical OIDC or CODEX_ANSTOSS_TOKEN.'
          exit 1
        fi
        if [[ "$token" == *$'\n'* || "$token" == *$'\r'* ]]; then
          echo '::error::GitHub review token must be a single line.'
          exit 1
        fi
        printf '::add-mask::%s\n' "$token"
        printf 'CODEX_ANSTOSS_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
