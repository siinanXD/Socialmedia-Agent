# Claude in der GitHub-Cloud (SIN-1127): Aufgaben laufen auch bei ausgeschaltetem PC.
# Auslöser: @claude in Issue-/PR-Kommentaren und Reviews, oder Label "claude" auf einem Issue.
# Es läuft nur für Nutzer mit Schreibrechten (Standard der Action). Abo-Zugang über
# CLAUDE_CODE_OAUTH_TOKEN (Repo-Secret, Quelle Infisical), kein API-Key.
# Kein github_token: die Action nutzt die Claude-GitHub-App, damit CI auf Claudes Commits läuft.
# Bei Aufträgen aus einem Issue öffnet Claude den PR selbst (gh pr create).
# Danach gelten Gate und Labels aus AGENTS.md. Workflow-Dateien kann Claude nicht pushen
# (Token ohne workflows-Recht), Änderungen an .github/ merged Sinan von Hand.
# Vor dem Push prüft Claude wie build.yml: npm (falls package-lock.json existiert), Worker mit uv.
# Kein Docker, kein Playwright, keine Datenbank (supabase test db läuft nur in build.yml).

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      || (github.event_name == 'issues' && github.event.label.name == 'claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Werkzeuge für die Prüfungen vor dem Push, gleiche wie in build.yml.
      - if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: hashFiles('worker/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v6
      - name: FFmpeg
        if: hashFiles('worker/pyproject.toml') != ''
        # man-db-Trigger abschalten: sonst dauert apt auf ubuntu-24.04 mehrere Minuten.
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(cd:*),Bash(npm ci:*),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*),Bash(npx tsc:*),Bash(npx vitest:*),Bash(npx eslint:*),Bash(uv sync:*),Bash(uv run ruff:*),Bash(uv run mypy:*),Bash(uv run pytest:*),Bash(ffprobe -version:*)"
            --append-system-prompt "PR-Regel: Wurdest du auf einem Issue ausgelöst und hast Commits auf deinen eigenen Branch gepusht, öffne den Pull Request selbst mit: gh pr create --head <dein Branch> --base <Default-Branch> --title <Titel> --body <Text>. Kein Draft. Branch claude/sin-<nr>-<slug>. Titel als Conventional Commit mit Linear-ID, z. B. docs(readme): Hinweis ergänzen (SIN-123); Teilschritte mit (Part of SIN-123). Body beginnt mit 'Closes #<Issue-Nummer>' und sagt in zwei Sätzen, was geändert wurde und wie es geprüft wurde. Prüfe vorher mit gh pr list --head <dein Branch>, ob es schon einen PR gibt. Schreib danach den Link zum PR in deinen Kommentar statt des Create-PR-Links. Nie mergen, nie Labels setzen oder entfernen. Wurdest du auf einem PR ausgelöst, öffne keinen neuen PR. Regeln aus AGENTS.md gelten: nichts veröffentlichen, kein Geld ausgeben, keine Secrets, Test zuerst, kleinster Diff. Prüfen vor dem Push wie in .github/workflows/build.yml: npm ci, npm run lint --if-present, npm run typecheck, npm test (nur wenn package-lock.json existiert); im Ordner worker/ uv sync --locked, uv run ruff check ., uv run mypy ., uv run pytest. Kein Docker, kein Playwright, kein supabase test db. Committe nie node_modules, .venv oder Build-Ausgaben. Schreib in deinen Kommentar, welche Prüfungen grün waren und welche du nicht ausführen konntest."
